name: safishacon_mobile
description: "SafishaCon customer app for cleaning in Dar es Salaam."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/home/
    - assets/images/services/
    - assets/images/onboarding/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
