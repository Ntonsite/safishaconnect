server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression. Static text assets are precompressed at build time (gzip_static);
  # anything else textual — notably proxied API JSON — is compressed on the fly.
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Same-origin API: the browser never needs CORS in the Docker setup.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Content-hashed build output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed public files (logo/favicon): short cache.
  location /brand/ {
    add_header Cache-Control "public, max-age=86400";
  }

  # The HTML entry point must always revalidate so new deploys are picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri /index.html;
  }
}
