# Edge rate limit for sign-in/registration, shared by every API replica behind this proxy.
# Generous on purpose: Tanzanian mobile networks put many customers behind one carrier-NAT IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# Propagate a caller's X-Request-ID, otherwise use nginx's own id, so one id follows the
# request from the edge through API logs.
map $http_x_request_id $safisha_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression. Static text assets are precompressed at build time (gzip_static);
  # anything else textual — notably proxied API JSON — is compressed on the fly.
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  client_max_body_size 1m;

  # Same-origin API: the browser never needs CORS in the Docker setup.
  # nginx is the edge here, so it *replaces* X-Forwarded-For with the real peer address;
  # a client-supplied header can never reach the API. (Behind a cloud load balancer, add
  # set_real_ip_from/real_ip_header for that balancer instead.)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $safisha_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Never replay a request to the API on failure: POSTs are not idempotent (nginx default).
    proxy_next_upstream off;
  }

  # Only endpoints that check a password/credential are throttled at the edge. Session
  # endpoints such as /auth/me run on every page load and must never be limited.
  location ~ ^/api/v1/auth/(login|register|register/provider|refresh|change-password)$ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $safisha_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Content-hashed build output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Unhashed public files (logo/favicon): short cache.
  location /brand/ {
    add_header Cache-Control "public, max-age=86400";
  }

  # The HTML entry point must always revalidate so new deploys are picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri /index.html;
  }
}
